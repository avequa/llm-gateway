# Шлюз, Ollama на GPU и стек наблюдаемости: метрики (Prometheus), алерты (Alertmanager), дашборды (Grafana), трейсы (Jaeger)
# Ollama живет в том же compose, шлюз находит ее по имени сервиса, видеокарта пробрасывается через Docker (NVIDIA)
# все порты открыты только на 127.0.0.1, у сервисов наблюдаемости лимиты памяти, чтобы не нагружать ноутбук

name: llm-gateway

services:
  gateway:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: llm-gateway:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./deploy/gateway.yaml:/etc/llm-gateway/config.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: llm-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    depends_on:
      jaeger:
        condition: service_started
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      # уже скачанные модели с хоста (путь задается в .env), иначе отдельный volume и модели качаются заново
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: 5m          # через 5 минут простоя модель выгружается из видеопамяти
      OLLAMA_NUM_PARALLEL: "1"       # один запрос на модель за раз, очередь держит шлюз
      OLLAMA_MAX_LOADED_MODELS: "2"  # не больше двух моделей в видеопамяти (8 ГБ)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    mem_limit: 64m

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    depends_on: [prometheus, jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    mem_limit: 256m

volumes:
  ollama-models:
  prometheus-data:
  alertmanager-data:
  grafana-data:
