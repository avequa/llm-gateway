# Пример конфига: агенты обращаются к ролям small, main и validator, шлюз сам выбирает модель и делает fallback
# скопируй в config.yaml и меняй его, config.yaml в git не попадает
server:
  addr: 127.0.0.1:4000
  shutdown_timeout: 15s

upstreams:
  ollama:
    base_url: http://localhost:11434/v1
    timeout: 120s        # сколько ждать начала ответа модели (первая загрузка в видеопамять бывает долгой)
    max_concurrent: 1    # одна видеокарта - один запрос за раз, остальные ждут в очереди
    queue_timeout: 180s  # сколько запрос может ждать в очереди, потом 429
  # облачный API подключается так же, ключ берется из переменной окружения, а не из файла
  # openrouter:
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  #   timeout: 60s
  #   max_concurrent: 4

models:
  small:                 # быстрые простые шаги: классификация запроса, выбор следующего агента
    params:              # подставляются, если агент не указал их сам
      reasoning_effort: none
      temperature: 0.1
    max_tokens: 512      # потолок длины ответа, больше не пропустим
    targets:
      - {upstream: ollama, model: qwen3:1.7b}
      - {upstream: ollama, model: qwen3:4b}
  main:                  # анализ логов и вызов tools
    params:
      reasoning_effort: none
    max_tokens: 2048
    targets:
      - {upstream: ollama, model: qwen3:4b}
      - {upstream: ollama, model: qwen3:1.7b}
  validator:             # проверка ответов main: модель другого семейства (Gemma от Google, а не Qwen от Alibaba)
    params:
      temperature: 0
    max_tokens: 1024
    targets:
      - {upstream: ollama, model: gemma3:4b}
