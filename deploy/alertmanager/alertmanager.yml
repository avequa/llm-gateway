# Alertmanager: группирует алерты и отправляет получателю
# по умолчанию алерты видны в UI (http://127.0.0.1:9093) и в Grafana, внешней отправки нет
# для Telegram раскомментируй получателя telegram и положи токен бота в deploy/alertmanager/telegram_token
route:
  receiver: ui-only
  group_by: [alertname, model]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # routes:
  #   - receiver: telegram
  #     matchers: [severity=~"warning|critical"]

receivers:
  - name: ui-only
  # - name: telegram
  #   telegram_configs:
