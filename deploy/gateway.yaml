# Конфиг шлюза для docker-compose: слушает все интерфейсы контейнера, Ollama - соседний сервис ollama
# Модели лёгкие (до 1.7B), чтобы не грузить видеокарту ноутбука: qwen3:4b думала до 2048 токенов на ответ
server:
  addr: 0.0.0.0:4000
  shutdown_timeout: 15s

upstreams:
  ollama:
    base_url: http://ollama:11434/v1
    timeout: 120s
    max_concurrent: 1
    queue_timeout: 180s

models:
  small:
    params:
      reasoning_effort: none
      temperature: 0.1
    max_tokens: 512
    targets:
      - {upstream: ollama, model: qwen3:1.7b}
      - {upstream: ollama, model: qwen3:0.6b}
  main:
    params:
      reasoning_effort: none
      temperature: 0.2
    max_tokens: 1024
    targets:
      - {upstream: ollama, model: qwen3:1.7b}
      - {upstream: ollama, model: qwen3:0.6b}
  validator:
    params:
      temperature: 0
    max_tokens: 512
    targets:
      - {upstream: ollama, model: gemma3:1b}
