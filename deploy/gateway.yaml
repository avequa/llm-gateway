# Конфиг шлюза для docker-compose: слушает все интерфейсы контейнера, Ollama - соседний сервис ollama
server:
  addr: 0.0.0.0:4000
  shutdown_timeout: 15s

upstreams:
  ollama:
    base_url: http://ollama:11434/v1
    timeout: 120s
    max_concurrent: 1
    queue_timeout: 180s

models:
  small:
    params:
      reasoning_effort: none
      temperature: 0.1
    max_tokens: 512
    targets:
      - {upstream: ollama, model: qwen3:1.7b}
      - {upstream: ollama, model: qwen3:4b}
  main:
    params:
      reasoning_effort: none
    max_tokens: 2048
    targets:
      - {upstream: ollama, model: qwen3:4b}
      - {upstream: ollama, model: qwen3:1.7b}
  validator:
    params:
      temperature: 0
    max_tokens: 1024
    targets:
      - {upstream: ollama, model: gemma3:4b}
