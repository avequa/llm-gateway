# Prometheus: раз в 15 секунд забирает метрики шлюза и самого себя, правила алертов - в alerts.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: llm-gateway
    static_configs:
      - targets: ["gateway:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
